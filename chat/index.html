<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>いまの会話 — MyCrypto Games</title>
<meta name="description" content="bearko.games の全タイトルをまたぐ会話。攻略の話も、いまどのゲームがにぎわっているかも。">
<meta name="theme-color" content="#0b0d14">
<link rel="icon" href="https://raw.githubusercontent.com/bearko/mycryptoheroes/main/Image/Icons/mch_icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+1p:wght@500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/chat.css">
</head>
<body>
<header class="ch-top">
  <a href="../" class="ch-back">← ゲーム一覧</a>
  <h1>いまの会話</h1>
  <nav class="ch-links">
    <a href="../score/">スコア</a>
    <a href="../rta/">RTA</a>
    <a href="../me/">マイページ</a>
  </nav>
</header>
<div class="ch-body">
  <aside class="ch-side">
    <h2>タイトルで絞る</h2>
    <div class="chips" id="filters" role="tablist" aria-label="タイトル"></div>
    <p class="ch-note">数字は直近 24 時間の発言の数。読むだけなら誰でも、話すにはログインして名前を決める。</p>
  </aside>
  <section class="ch-main">
    <div id="timeline" class="ch-tl" aria-label="タイムライン"></div>
    <p class="ch-fallback" id="fallback" hidden>通信できませんでした。時間をおいて開き直してください。</p>
  </section>
</div>
<script src="../sdk/v1.js"></script>
<script>
  // SPEC-005 5.5：タイトル横断のタイムライン。窓は使わず、SDK の mount でこの場所に描く
  (function () {
    var BG = window.BearkoGames;
    var GAMES = [['', 'すべて'], ['survivor', 'Survivor'], ['tactics', 'Tactics'], ['workshop', 'Workshop'], ['factory', 'Factory'], ['fortress', 'Fortress'], ['deckbattle', 'DeckBattle'], ['10buy', '10 buy year!'], ['education', 'Education'], ['portal', 'bearko.games']];
    var current = '';
    var counts = {};
    function renderFilters() {
      var box = document.getElementById('filters');
      box.textContent = '';
      GAMES.forEach(function (g) {
        var b = document.createElement('button');
        b.type = 'button'; b.className = 'chip' + (current === g[0] ? ' on' : ''); b.setAttribute('role', 'tab'); b.setAttribute('aria-selected', String(current === g[0]));
        var label = document.createElement('span'); label.textContent = g[1]; b.appendChild(label);
        var n = g[0] ? counts[g[0]] : Object.keys(counts).reduce(function (s, k) { return s + counts[k]; }, 0);
        if (n) { var c = document.createElement('b'); c.textContent = String(n); b.appendChild(c); }
        b.addEventListener('click', function () { current = g[0]; BG.chat.setFilter(current || null); renderFilters(); });
        box.appendChild(b);
      });
    }
    if (!BG) { document.getElementById('fallback').hidden = false; return; }
    renderFilters();
    BG.init({ game: 'portal', apiBase: location.origin, chat: { ui: false } }).then(function (r) {
      if (!r.ok) document.getElementById('fallback').hidden = false;
      BG.chat.mount(document.getElementById('timeline'), { composerAt: 'top', title: 'タイトル横断' });
      BG.chat.stats().then(function (s) { if (s.ok) { counts = s.games || {}; renderFilters(); } });
    });
  })();
</script>
</body>
</html>

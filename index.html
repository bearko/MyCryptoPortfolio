<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MyCrypto Games — bearko のゲームポートフォリオ</title>
<meta name="description" content="My Crypto Heroes のアセットで作ったブラウザゲーム9本。デッキ構築ローグライク・経営シム・サバイバルアクション・教育クイズ・タワーディフェンスなど。">
<meta name="theme-color" content="#0b0d14">
<meta property="og:type" content="website">
<meta property="og:title" content="MyCrypto Games — bearko のゲームポートフォリオ">
<meta property="og:description" content="My Crypto Heroes のアセットで作ったブラウザゲーム9本を、スクリーンショットつきで紹介します。">
<meta property="og:url" content="https://bearko.games/">
<meta property="og:image" content="https://bearko.games/og-image.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="https://raw.githubusercontent.com/bearko/mycryptoheroes/main/Image/Icons/mch_icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+1p:wght@500;700;900&family=DotGothic16&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/mine.css">
</head>
<body>
<!-- 背景をゆっくり流れるヒーロー（飾り。動きを減らす設定では止める） -->
<div class="drift" id="drift" aria-hidden="true"></div>
<div class="app">
  <header class="top">
    <div class="brand">
      <img class="brand-icon" src="https://raw.githubusercontent.com/bearko/mycryptoheroes/main/Image/Heroes/1003.png" alt="">
      <div>
        <h1>MyCrypto Games <span class="alpha" title="サイトは試験公開中です。表示や記録の仕組みが変わることがあります">α版</span></h1>
        <p class="tagline">マイクリのアセットで作ったブラウザゲーム <b id="count">9</b> 本</p>
      </div>
    </div>
    <div class="top-links">
      <a class="me-link" href="score/">スコア</a>
      <a class="me-link" href="rta/">RTA</a>
      <a class="me-link ach-link" href="achievements/">アチーブメント</a>
      <a class="me-link chat-link" href="chat/">チャット</a>
      <a class="me-link" href="me/">マイページ</a>
      <button class="bgm" id="bgm" type="button" aria-pressed="true" aria-label="BGM を止める">♪</button>
      <a class="gh" href="https://github.com/bearko" target="_blank" rel="noopener" aria-label="GitHub">
      <svg viewBox="0 0 16 16" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg>
      </a>
    </div>
  </header>

  <!-- SPEC-005 5.5: タイトル横断の会話を流す。押すとタイムライン（/chat/） -->
  <a class="ticker" id="ticker" href="chat/" hidden aria-label="いまの会話を見る">
    <span class="ticker__tag">💬</span>
    <span class="ticker__win"><span class="ticker__track" id="ticker-track"></span></span>
  </a>

  <main class="home" id="home">
    <!-- 戻ってきた人：最近遊んだゲームと、次の節目（そこで戻ってくるヒーロー）。トロフィーが 1 つもなければ出さない -->
    <section class="cont" id="cont" hidden aria-labelledby="cont-title">
      <h2 class="sec-title" id="cont-title">つづきから</h2>
      <div class="cont-list" id="cont-list"></div>
    </section>

    <!-- はじめての人へのおすすめ 3 本。短い時間で最初の手ごたえが来るもの（js/games.js の FEATURED） -->
    <section class="feat" id="feat" aria-roledescription="カルーセル" aria-labelledby="feat-title">
      <div class="sec-head">
        <h2 class="sec-title" id="feat-title">はじめての人に</h2>
        <p class="sec-sub">すぐに最初の手ごたえが来る 3 本</p>
      </div>
      <div class="feat-track" id="feat-track"></div>
      <div class="feat-dots" id="feat-dots" role="group" aria-label="おすすめを切り替える"></div>
    </section>

    <section class="all" aria-labelledby="all-title">
      <div class="sec-head">
        <h2 class="sec-title" id="all-title">すべてのゲーム</h2>
        <div class="moods" id="moods" role="group" aria-label="遊び方で絞る"></div>
      </div>
      <div class="grid" id="grid" aria-label="ゲーム一覧"></div>
    </section>
  </main>

  <footer class="foot">
    キャラクター画像・BGM/SE は My Crypto Heroes（MCH Co., Ltd.）に帰属し、許諾のもとで利用しています。各作品は非公式のファン制作です。
  </footer>
</div>

<!-- 詳細シート（アプリストアの作品ページ風） -->
<dialog class="sheet" id="sheet" aria-labelledby="sheet-title">
  <div class="sheet-inner" id="sheet-body"></div>
  <!-- スクリーンショットの拡大。モーダルの上に出すため dialog の中に置く（top layer の外だと隠れる） -->
  <div class="lightbox" id="lightbox" hidden><img id="lightbox-img" alt=""></div>
</dialog>


<!-- SPEC-008 4 章：マインの案内（初めて来たとき・ヒーローを呼び戻して戻ってきたとき） -->
<dialog class="mine" id="mine" aria-label="マインの案内"></dialog>

<script type="module" src="js/main.js"></script>
<script src="js/stat.js" defer></script>
<script src="js/guide.js" defer></script>
<script src="js/bgm.js" defer></script>
<script src="sdk/v1.js"></script>
<script>
  // SPEC-004 / SPEC-005: 全体チャット。ポータルは「portal」として参加する。
  // PC（幅 1100px 以上）は右側にタイムラインを固定（ドック。▸ で畳める）。そのぶん一覧を左に詰める（SPEC-005 5.5）。
  // それより狭いときは 💬 の窓・シート。タイトル横断の直近の発言は上の帯に流す（押すと /chat/。ドックが開いているときは出さない）
  if (window.BearkoGames) {
    BearkoGames.init({ game: 'portal', apiBase: location.origin, chat: { layout: 'dock', position: 'bottom-right', offset: { x: 16, y: 16 } } }).then(function () {
      BearkoGames.chat.onToggle(dockSync);
      window.addEventListener('resize', dockSync);
      dockSync();
      BearkoGames.chat.connect();   // 窓を開かなくても直近の発言を受け取る（流すため）
      BearkoGames.chat.onMessage(function (m) { if (m.t === 'msg' || m.t === 'del' || m.t === 'edit') tickerRender(); });
      var tries = 0;
      (function wait() { tickerRender(); if (!BearkoGames.chat.getMessages().length && tries++ < 8) setTimeout(wait, 700); })();
    });
  }
  function docked() { return BearkoGames.chat.layout() === 'dock' && BearkoGames.chat.isOpen(); }
  function dockSync() {
    document.body.classList.toggle('chat-docked', docked());
    tickerRender();
  }
  function tickerRender() {
    var ticker = document.getElementById('ticker'), track = document.getElementById('ticker-track');
    if (!ticker || !track) return;
    if (docked()) { ticker.hidden = true; return; }   // 同じ会話が右に出ている
    var msgs = BearkoGames.chat.getMessages().filter(function (m) { return m.parent == null; }).sort(function (a, b) { return b.id - a.id; }).slice(0, 12);
    ticker.hidden = !msgs.length;
    if (!msgs.length) return;
    var LABEL = { survivor: 'Survivor', tactics: 'Tactics', workshop: 'Workshop', factory: 'Factory', fortress: 'Fortress', deckbattle: 'DeckBattle', '10buy': '10 buy year!', education: 'Education', advance: 'Advance', portal: 'bearko.games' };
    track.textContent = '';
    // 同じ列を 2 回並べ、半分ぶん流して戻すと切れ目なく回る
    [0, 1].forEach(function (k) {
      msgs.forEach(function (m) {
        var it = document.createElement('span'); it.className = 'ticker__it'; if (k) it.setAttribute('aria-hidden', 'true');
        var av = document.createElement('span'); av.className = 'ticker__av';
        var url = BearkoGames.avatarUrl(m.avatar);
        if (url) { var img = document.createElement('img'); img.alt = ''; img.src = url; img.loading = 'lazy'; img.addEventListener('error', function () { av.textContent = (m.name || '?').slice(0, 1); }); av.appendChild(img); }
        else av.textContent = (m.name || '?').slice(0, 1);
        var nm = document.createElement('b'); nm.textContent = m.name || '名無し';
        var g = document.createElement('i'); g.textContent = LABEL[m.game] || m.game;
        var t = document.createElement('span'); t.className = 'ticker__t'; t.textContent = m.text;
        it.appendChild(av); it.appendChild(nm); it.appendChild(g); it.appendChild(t);
        track.appendChild(it);
      });
    });
    track.style.setProperty('--n', String(msgs.length));
  }
</script>
</body>
</html>

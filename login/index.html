<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ログイン — MyCrypto Games</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0b0d14">
<link rel="icon" href="https://raw.githubusercontent.com/bearko/mycryptoheroes/main/Image/Icons/mch_icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+1p:wght@500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/account.css">
</head>
<body>
<main class="card">
  <img class="mark" src="https://raw.githubusercontent.com/bearko/mycryptoheroes/main/Image/Heroes/1003.png" alt="">
  <h1>MyCrypto Games にログイン</h1>

  <section id="step-login">
    <p class="lead">1 つのアカウントで、bearko.games のすべてのゲームのランキング・アチーブメントに参加できます。</p>
    <div id="google-button" class="google"></div>
    <p class="note">保存するのは Google のアカウント識別番号と、あなたが決める表示名だけです。メールアドレスや本名は保存しません。</p>
  </section>

  <section id="step-name" hidden>
    <p class="lead">ランキングに出る名前を決めてください（あとでマイページから変えられます）。</p>
    <form id="name-form" class="row">
      <input id="name" maxlength="16" autocomplete="nickname" placeholder="表示名（16 文字まで）" required>
      <button class="primary" type="submit">決定</button>
    </form>
    <button class="link" id="skip" type="button">あとで決める</button>
  </section>

  <section id="step-done" hidden>
    <p class="lead" id="done-text">ログインしました。</p>
    <p><a class="primary" id="back" href="../me/">マイページへ</a></p>
  </section>

  <p class="error" id="error" hidden></p>
</main>

<script>
(function () {
  'use strict';
  var ORIGIN_RE = /^https:\/\/([a-z0-9-]+\.)*bearko\.games$/;
  var params = new URLSearchParams(location.search);
  var opener = window.opener && ORIGIN_RE.test(params.get('origin') || '') ? params.get('origin') : null;
  var ret = params.get('return');
  try { ret = ret && ORIGIN_RE.test(new URL(ret).origin) ? ret : null; } catch (e) { ret = null; }
  var user = null;
  var merged = 0;

  var $ = function (id) { return document.getElementById(id); };
  function show(step) {
    ['step-login', 'step-name', 'step-done'].forEach(function (s) { $(s).hidden = s !== step; });
  }
  function fail(text) { $('error').textContent = text; $('error').hidden = false; }

  // ゲームに戻る：ポップアップなら知らせて閉じる。移動で来たなら元のページへ
  function finish() {
    if (opener && window.opener) {
      try { window.opener.postMessage({ type: 'bearko-games:login', user: user, mergedTrophies: merged }, opener); } catch (e) {}
      window.close();
    }
    if (ret) { location.href = ret; return; }
    $('done-text').textContent = (user && user.name ? user.name + ' さん、' : '') + 'ログインしました。' + (merged ? 'この端末のアチーブメント ' + merged + ' 個を登録しました。' : '');
    show('step-done');
  }

  function post(path, body) {
    return fetch(path, { method: 'POST', credentials: 'same-origin', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) })
      .then(function (r) { return r.json().then(function (d) { return { ok: r.ok, data: d }; }); });
  }

  function onCredential(res) {
    $('error').hidden = true;
    post('/api/auth/google', { credential: res.credential }).then(function (r) {
      if (!r.ok) return fail('ログインできませんでした。もう一度お試しください。');
      user = r.data.user;
      merged = r.data.mergedTrophies || 0;
      if (!user.name) { show('step-name'); $('name').focus(); } else finish();
    }).catch(function () { fail('通信できませんでした。電波のよいところでもう一度お試しください。'); });
  }

  $('name-form').addEventListener('submit', function (e) {
    e.preventDefault();
    post('/api/me/name', { name: $('name').value }).then(function (r) {
      if (!r.ok) return fail('その名前は使えません。別の名前にしてください。');
      user = r.data.user;
      finish();
    }).catch(function () { fail('通信できませんでした。'); });
  });
  $('skip').addEventListener('click', finish);

  fetch('/api/config').then(function (r) { return r.json(); }).then(function (cfg) {
    if (!cfg.googleClientId) return fail('ログインの準備ができていません。');
    var s = document.createElement('script');
    s.src = 'https://accounts.google.com/gsi/client';
    s.async = true;
    s.onload = function () {
      google.accounts.id.initialize({ client_id: cfg.googleClientId, callback: onCredential, ux_mode: 'popup' });
      google.accounts.id.renderButton($('google-button'), { theme: 'filled_black', size: 'large', shape: 'pill', text: 'signin_with', locale: 'ja' });
    };
    s.onerror = function () { fail('Google のログインを読み込めませんでした。'); };
    document.head.appendChild(s);
  }).catch(function () { fail('通信できませんでした。'); });
})();
</script>
</body>
</html>

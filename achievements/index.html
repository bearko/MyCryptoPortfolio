<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>アチーブメント — MyCrypto Games</title>
<meta name="description" content="bearko.games のアチーブメント。ゲームを遊んで、マイクリのヒーローとエクステンションを呼び戻そう。">
<meta name="theme-color" content="#0a0a0f">
<link rel="icon" href="https://raw.githubusercontent.com/bearko/mycryptoheroes/main/Image/Icons/mch_icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+1p:wght@500;700;900&family=Shippori+Mincho+B1:wght@700;800&family=Cinzel:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/achievements.css">
</head>
<body>
<div class="hall">
  <header class="hall-top">
    <a href="../" class="back">← ゲーム一覧</a>
    <img class="crest" src="https://raw.githubusercontent.com/bearko/mycryptoheroes/main/Image/Icons/emblem.webp" alt="" width="64" height="64">
    <p class="eyebrow">HALL OF HEROES</p>
    <h1>アチーブメント</h1>
    <p class="lead">ヒーロー名鑑をすべて埋めると、<b>真のゲームクリア</b>。</p>
  </header>

  <!-- SPEC-008 3.2：ヒーローとエクステンションのタブ。（獲得数 / 総数）を常に見せる -->
  <div class="tabs" role="tablist" aria-label="アチーブメントの種類">
    <button type="button" role="tab" id="tab-hero" aria-controls="panel" data-kind="hero" aria-selected="true">
      <span class="tab-name">ヒーロー名鑑</span><span class="tab-count" id="count-hero">– / –</span>
    </button>
    <button type="button" role="tab" id="tab-ext" aria-controls="panel" data-kind="ext" aria-selected="false">
      <span class="tab-name">エクステンション</span><span class="tab-count" id="count-ext">– / –</span>
    </button>
  </div>

  <section class="panel" id="panel" role="tabpanel" aria-labelledby="tab-hero">
    <div class="complete" id="complete" hidden>
      <p class="complete-k">COMPLETE</p>
      <p class="complete-n">ヒーロー名鑑 完成 — 真のゲームクリア</p>
      <p class="complete-d" id="complete-date"></p>
    </div>

    <div class="progress">
      <p class="progress-n"><b id="got">–</b><span class="slash">/</span><span id="total">–</span></p>
      <div class="bar" role="progressbar" id="bar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><span id="bar-fill"></span></div>
      <ul class="by-rarity" id="by-rarity" aria-label="レアリティごとの獲得数"></ul>
    </div>

    <nav class="filters" id="filters" aria-label="タイトルでしぼる"></nav>

    <p class="note" id="note" hidden></p>
    <p class="note" id="loading">読み込み中…</p>
    <div id="shelves"></div>
  </section>

  <footer class="hall-foot">
    <p>アチーブメントはゲームの中で獲得できます。ログインしなくても記録され、あとでログインするとアカウントにまとまります（<a href="../me/">マイページ</a>）。</p>
    <p>キャラクター画像は My Crypto Heroes（MCH Co., Ltd.）に帰属し、許諾のもとで利用しています。</p>
  </footer>
</div>

<!-- 1 枚の詳細（押すと開く） -->
<dialog class="relic" id="relic" aria-labelledby="relic-name">
  <div class="relic-in" id="relic-body"></div>
</dialog>

<p class="error" id="error" hidden></p>

<script src="../sdk/v1.js"></script>
<script src="../js/achievements.js"></script>
</body>
</html>
